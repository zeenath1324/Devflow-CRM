name: DevFlow CRM Enterprise CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: devflow_password
          POSTGRES_DB: devflow_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Compile Shared Packages
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/validation

      - name: Verify Prisma Schema & Client Generation
        run: npm run db:generate --workspace=packages/database
        env:
          DATABASE_URL: "postgresql://devflow:devflow_password@localhost:5432/devflow_crm?schema=public"

      - name: Build Backend API Service
        run: npm run build --workspace=apps/api

      - name: Build Web Application
        run: npm run build --workspace=apps/web
